services:
  - type: web
    name: prestata
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:push:pg && npm run db:generate:pg && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENTS_SANDBOX
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
